version: 2
updates:
  # Gradle/AGP/Kotlin/Compose versions are managed by hand in gradle/libs.versions.toml (DECISIONS D-017).
  # Paused until v0.6 is released (T27); then change the limit to 3.
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /eval
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      eval: { patterns: ["*"] }
